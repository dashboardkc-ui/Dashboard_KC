name: Script - Jupyter Notebook Execution

on:
  schedule:
    - cron: '0 5 * * *'  # 13h30 horário de Brasília
  workflow_dispatch:

jobs:
  rodar:
    runs-on: ubuntu-latest

    # Required permissions to push the updated notebook back to the repo
    permissions:
      contents: write

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install papermill jupyter
          pip install -r requirements.txt

      - name: Executar notebook
        env:
          SOCIAVAULT_API_KEY: ${{ secrets.SOCIAVAULT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          papermill notebook_test.ipynb executed_notebook.ipynb

      - name: Salvar alterações (commit)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: run notebook and update outputs [skip ci]"
          file_pattern: "executed_notebook.ipynb"
