name: Execute Jupyter Notebook

on:
  push:
    branches: [ "main" ]
  schedule:
    # Runs daily at 00:00 UTC (Adjust cron schedule as needed)
    - cron: '0 0 * * *'
  # Allows you to manually trigger the run from the Actions tab
  workflow_dispatch:

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    
    # Grant permissions to write/commit back to the repo
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install papermill jupyter
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Notebook
        run: |
          papermill my_notebook.ipynb executed_notebook.ipynb

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: run notebook and update outputs [skip ci]"
          file_pattern: "notebook_test.ipynb"
